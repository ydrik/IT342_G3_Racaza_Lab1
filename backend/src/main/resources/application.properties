# Application Name
spring.application.name=AnniMemo

# Server Configuration
server.port=8080

# MySQL Database Configuration
# IMPORTANT: Set your MySQL root password below (same password you use in MySQL Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/dbannimemo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=idonthavealife
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=AnniMemoSecretKeyForJWTTokenGenerationPleaseChangeThisInProduction2026
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Logging
logging.level.com.annimemo=DEBUG
logging.level.org.springframework.security=DEBUG
